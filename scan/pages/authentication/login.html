
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="og:description" content="Take Control of Your Crypto Portfolio with CryptoTrakX Tailwind Crypto Dashboard! Keep track of all your cryptocurrencies with ease using it.">
    <meta name="robots" content="index, follow">
    <meta name="og:title" property="og:title" content="CryptoTrakX: Tailwind Crypto Dashboard - Free Download">
    <meta property="og:image" content="https://designtocodes.com/wp-content/uploads/2024/04/CryptoTrackX-Dashboard-Thumbnai-01.jpg">
    <link rel="icon" href="../../public/assets/images/logo/favicon.png" type="image/gif" sizes="16x16">
    <title>Login - CryptoTrakX</title>
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <!-- Main Style -->
    <link rel="stylesheet" href="../../public/assets/css/style.css">
</head>

 <body>
    
    <!-- Preloader Start -->
    <div class="preloader h-full fixed w-full z-50 bg-white transition duration-300">
        <img src="../../public/assets/images/preloader.gif" class="max-w-[12rem] md:max-w-[20rem] block absolute top-2/4 left-2/4 transform -translate-x-2/4 -translate-y-2/4" alt="Loading">
    </div>
    <!-- Preloader End -->

    
    <section class="h-auto py-20 px-2 xxl:py-20 xxl:h-screen flex items-center bg-no-repeat bg-cover bg-center bg-[url('../images/rectangleBG.png')]">
        <div class="container p-6 lg:p-12 shadow-global rounded-md bg-white">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-7">
                <div class="text-center lg:px-8 xxl:px-24">
                    <div class="text-center">
                        <h2 class="text-3xl xl:text-4xl-1 text-secondary font-light uppercase xl:leading-[50px]">Do more with crypto, only on CryptoTrakX</h2>
                        <img src="../../public/assets/images/dollar-img.png" class="mx-auto my-6 block" alt="Dollar image">
                        <p>Set up your account and verify your photo ID to get started.</p>
                    </div>
                </div>
                <!-- form -->
                <div class="lg:px-8 xxl:px-24 flex flex-col justify-between">
                    <div>
                        <h2 class="d2c_title text-xl-1 lg:text-2xl xl:text-3xl">Sign in to Cryptotrakx</h2>
                        <p class="xxl:w-2/3">Not your device? Use a private or incognito window to sign in.</p>
                        <form action="#" class="validation mt-8" novalidate>
                            <div class="mb-6">
                                <label for="email" class="form-label">Email*</label>
                                <input id="email" name="email" type="email" autocomplete="email" class="form-control" placeholder="william@gmail.com" required>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label">Password*</label>
                                <div class="relative">
                                    <input id="password" type="password" class="form-control" placeholder="**********" required>
                                    <div class="absolute inset-y-0 right-0 flex items-center px-3 text-[#B6B5C5] cursor-pointer" onclick="showPassword()">
                                        <i class="far fa-eye"></i>
                                    </div>
                                </div>
                            </div>
                            <div class="grid gap-4 grid-cols-2">
                                <div>
                                    <div class="relative flex items-center gap-x-3">
                                        <div class="flex h-6 items-center">
                                            <label class="inline-flex items-center mr-0">
                                                <input class="mr-0 relative appearance-none rounded-sm-1 border cursor-pointer border-primary-shade-5 hover:border-primary checked:border-primary checked:transparent checked:after:content-['\2713'] checked:after:text-primary checked:after:absolute checked:after:top-1/2 checked:after:left-1/2 checked:after:-translate-x-1/2 checked:after:-translate-y-1/2 h-5 w-5 flex invalid:border-red-700" type="checkbox" id="remember" required>
                                                <span class="ml-2 font-semibold text-sm lg:text-base text-secondary">Remember Me</span>
                                            </label>
                                        </div>
                                    </div>
                                </div>
                                <div class="text-right">
                                    <a href="./resetPassword.html" class="text-primary text-sm lg:text-base font-semibold">Forget Password?</a>
                                </div>
                            </div>
                            <button type="submit" class="d2c_btn w-full my-7">Continue Login</button>
                        </form>
                        <div class="text-center">
                            <p class="capitalize text-secondary font-semibold bg-white px-2 inline-block mb-0">Or</p>
                            <hr class="-mt-3 border-primary-shade-5">
                        </div>
                        <div class="d2c_social_media mt-7 text-center last:mr-0">
                            <a href="#">
                                <i class="fab fa-google"></i>
                            </a>
                            <a href="#">
                                <i class="fab fa-apple"></i>
                            </a>
                            <a href="#">
                                <i class="fab fa-facebook-f"></i>
                            </a>
                        </div>
                    </div>

                    <p class="font-semibold font-base text-center mt-4">Don’t have an account? <a href="./registration.html" class="text-primary font-bold">SignUp</a></p>

                </div>
            </div>
        </div>
    </section>
    

    <!-- jquery -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <!-- Main Js Config -->
    <script src="../../public/assets/js/main.js"></script>
    <script src="../../public/assets/js/validation.js"></script>
</body>

</html>
